<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upscale Media - 画像を高解像度・高画質に</title>
<meta name="description" content="画像をドラッグ&ドロップするだけで、ブラウザ内で解像度アップ。画像は外部に送信されません。">
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #e8eaf0;
    --muted: #8b93a5; --accent: #6c8cff; --accent2: #b06cff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6fa; --panel: #fff; --line: #dde1ea; --text: #1b1e26; --muted: #666e80; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 {
    font-size: clamp(26px, 5vw, 40px); margin: 0 0 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 .ver {
    font-size: 14px; font-weight: 600; vertical-align: middle; margin-left: 6px; padding: 2px 10px;
    border-radius: 99px; color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-text-fill-color: #fff;
  }
  .sub { color: var(--muted); margin: 0 0 24px; }
  #drop {
    border: 2px dashed var(--line); border-radius: 16px; background: var(--panel);
    padding: 48px 16px; text-align: center; cursor: pointer; transition: .15s;
  }
  #drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
  #drop { display: block; position: relative; -webkit-tap-highlight-color: transparent; }
  #drop strong { font-size: 18px; }
  #drop small { color: var(--muted); display: block; margin-top: 6px; }
  #drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #drop.has { border-style: solid; border-color: var(--accent); padding: 16px; }
  #thumb { display: none; max-width: 100%; max-height: 40vh; border-radius: 10px; margin: 0 auto 10px; }
  #drop.has #thumb { display: block; }
  #drop.has #hint { display: none; }
  #fname { display: none; font-size: 14px; word-break: break-all; }
  #drop.has #fname { display: block; }
  #drop.has #again { display: block; }
  #again { display: none; color: var(--accent); font-size: 13px; margin-top: 4px; }
  @media (max-width: 640px) {
    .wrap { padding: 20px 14px calc(48px + env(safe-area-inset-bottom)); }
    #drop { padding: 32px 12px; }
    .opts { flex-direction: column; align-items: stretch; gap: 12px; }
    .opts label { justify-content: space-between; font-size: 15px; }
    select { font-size: 16px; min-height: 44px; }
    button.primary { min-height: 48px; width: 100%; font-size: 16px; }
  }
  @media (pointer: coarse) { select, button { min-height: 44px; } }
  .opts {
    display: flex; flex-wrap: wrap; gap: 16px; margin: 20px 0; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  }
  .opts label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  select, button {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px;
  }
  button.primary {
    background: linear-gradient(90deg, var(--accent), var(--accent2)); border: 0; color: #fff;
    padding: 10px 20px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { color: var(--muted); font-size: 14px; min-height: 22px; }
  progress { width: 100%; height: 6px; margin-top: 6px; display: none; }
  .result { display: none; margin-top: 24px; }
  .cmp {
    position: relative; overflow: hidden; border-radius: 12px; border: 1px solid var(--line);
    background: repeating-conic-gradient(#8883 0 25%, transparent 0 50%) 0 0/16px 16px;
    user-select: none; touch-action: none;
  }
  .cmp { margin: 0 auto; cursor: grab; }
  .stage { position: relative; transform-origin: 0 0; will-change: transform; }
  .cmp canvas { display: block; width: 100%; height: auto; }
  .cmp .before { position: absolute; inset: 0; clip-path: inset(0 50% 0 0); }
  .cmp .before canvas { width: 100%; height: 100%; }
  .bar {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #fff;
    box-shadow: 0 0 6px #0008; pointer-events: none;
  }
  .knob {
    position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; background: #fff; color: #333; display: grid; place-items: center;
    font-size: 16px; box-shadow: 0 2px 10px #0009; cursor: ew-resize; touch-action: none;
  }
  .zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
  .zoom button { width: 40px; height: 40px; padding: 0; border-radius: 50%; background: #000b; color: #fff; border: 0; font-size: 18px; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .hint2 { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  @media (max-width: 640px) { .btns button { flex: 1 1 100%; } }
  .tag {
    position: absolute; top: 10px; padding: 2px 10px; border-radius: 99px; font-size: 12px;
    background: #000a; color: #fff;
  }
  .tag.l { left: 10px; } .tag.r { right: 10px; }
  .meta { color: var(--muted); font-size: 14px; margin: 10px 0; }
  .note { color: var(--muted); font-size: 13px; margin-top: 32px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Upscale Media <span class="ver">v3</span></h1>
  <p class="sub">画像をドロップするだけで、解像度を上げてきれいに。処理はすべてあなたのブラウザ内で行われ、画像は外部に送信されません。</p>

  <label id="drop" for="file">
    <img id="thumb" alt="選択した画像のプレビュー">
    <div id="fname"></div>
    <div id="again">タップして別の画像を選ぶ</div>
    <div id="hint">
      <strong>ここに画像をドラッグ&ドロップ</strong>
      <small>またはここをタップして画像を選択（PNG / JPEG / WebP）</small>
    </div>
    <input id="file" type="file" accept="image/*">
  </label>

  <div class="opts">
    <label>拡大率
      <select id="scale">
        <option value="2" selected>2倍</option>
        <option value="3">3倍</option>
        <option value="4">4倍</option>
      </select>
    </label>
    <label>方式
      <select id="mode">
        <option value="ai" selected>AI（ESRGAN）— 高品質・やや重い</option>
        <option value="fast">高速（補間＋シャープ化）</option>
      </select>
    </label>
    <label>シャープ化
      <select id="sharp">
        <option value="0">なし</option>
        <option value="0.4" selected>弱</option>
        <option value="0.8">強</option>
      </select>
    </label>
    <button id="run" class="primary" disabled>高画質化する</button>
  </div>
  <div id="status"></div>
  <progress id="prog" max="1" value="0"></progress>

  <div class="result" id="result">
    <div class="meta" id="meta"></div>
    <div class="cmp" id="cmp">
      <div class="stage" id="stage">
        <canvas id="after"></canvas>
        <div class="before"><canvas id="before"></canvas></div>
      </div>
      <div class="bar" id="bar"><div class="knob" id="knob">↔</div></div>
      <span class="tag l">Before</span><span class="tag r">After</span>
      <div class="zoom"><button id="zin" aria-label="拡大">＋</button><button id="zout" aria-label="縮小">－</button><button id="zreset" aria-label="全体表示">⤢</button></div>
    </div>
    <p class="hint2">2本指でピンチ（拡大・縮小）、1本指でドラッグして移動。丸いつまみを動かすと Before / After を比べられます。</p>
    <div class="btns">
      <button id="save" class="primary" disabled>写真に保存</button>
      <button id="dl">ファイルとして保存（ダウンロード）</button>
    </div>
    <p class="hint2">iPhone / iPad は「写真に保存」→ 共有メニューの「画像を保存」で写真アプリに入ります。</p>
  </div>

  <p class="note">AI方式は初回のみモデル（数MB）をダウンロードします。大きな画像は自動的に分割して処理します。AIが使えない環境では高速方式に自動で切り替わります。</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/default-model@1.0.0/dist/umd/index.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/upscaler@1.0.0/dist/browser/umd/upscaler.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-slim@1.0.0/dist/umd/models/esrgan-slim/src/x2/index.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-slim@1.0.0/dist/umd/models/esrgan-slim/src/x3/index.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-slim@1.0.0/dist/umd/models/esrgan-slim/src/x4/index.min.js" defer></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const drop = $('drop'), fileIn = $('file'), run = $('run'), status = $('status'), prog = $('prog');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const MAX_OUT = isIOS ? 4096 * 4096 : 8192 * 8192 / 2; // 出力ピクセル数の上限（iOSはキャンバス上限が小さい）
  let srcImg = null, srcName = 'image', outCanvas = null;
  const upscalers = {};

  const setStatus = t => status.textContent = t;

  function load(file) {
    if (!file || !file.type.startsWith('image/')) return setStatus('画像ファイルを選んでください。');
    const img = new Image();
    img.onload = () => {
      srcImg = img; srcName = file.name.replace(/\.[^.]+$/, '');
      run.disabled = false; $('result').style.display = 'none';
      $('thumb').src = img.src; drop.classList.add('has');
      $('fname').textContent = `${file.name || '画像'}（${img.naturalWidth}×${img.naturalHeight}px）`;
      setStatus('✓ 画像を読み込みました。「高画質化する」を押してください。');
    };
    img.onerror = () => setStatus('画像を読み込めませんでした。');
    img.src = URL.createObjectURL(file);
  }

  fileIn.onchange = () => { load(fileIn.files[0]); fileIn.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => load(e.dataTransfer.files[0]));
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  // 補間（段階的に2倍ずつ拡大して品質を保つ）
  function resizeSmooth(src, w, h) {
    let cur = src, cw = src.width || src.naturalWidth, ch = src.height || src.naturalHeight;
    while (cw < w || ch < h) {
      const nw = Math.min(w, cw * 2), nh = Math.min(h, ch * 2);
      const c = document.createElement('canvas'); c.width = nw; c.height = nh;
      const g = c.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
      g.drawImage(cur, 0, 0, nw, nh);
      cur = c; cw = nw; ch = nh;
    }
    return cur;
  }

  // アンシャープマスク
  function sharpen(canvas, amount) {
    if (!amount) return canvas;
    const w = canvas.width, h = canvas.height, g = canvas.getContext('2d');
    const img = g.getImageData(0, 0, w, h), d = img.data, o = new Uint8ClampedArray(d);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = (y * w + x) * 4;
      for (let c = 0; c < 3; c++) {
        const lap = 4 * o[i + c] - o[i - 4 + c] - o[i + 4 + c] - o[i - w * 4 + c] - o[i + w * 4 + c];
        d[i + c] = o[i + c] + amount * lap;
      }
    }
    g.putImageData(img, 0, 0);
    return canvas;
  }

  function getUpscaler(scale) {
    if (upscalers[scale]) return upscalers[scale];
    const defs = { 2: window.ESRGANSlim2x, 3: window.ESRGANSlim3x, 4: window.ESRGANSlim4x };
    const m = defs[scale];
    if (!m || !window.Upscaler || !window.tf) throw new Error('AIライブラリを読み込めませんでした');
    const path = `https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-slim@1.0.0/models/x${scale}/model.json`;
    const model = { ...m, path, _internals: { ...(m._internals || {}), path } };
    return upscalers[scale] = new Upscaler({ model });
  }

  async function aiUpscale(img, scale) {
    const up = getUpscaler(scale);
    const dataUrl = await up.upscale(img, {
      patchSize: 64, padding: 4,
      progress: p => { prog.value = p; },
    });
    const out = new Image();
    await new Promise((res, rej) => { out.onload = res; out.onerror = rej; out.src = dataUrl; });
    const c = document.createElement('canvas'); c.width = out.naturalWidth; c.height = out.naturalHeight;
    c.getContext('2d').drawImage(out, 0, 0);
    return c;
  }

  run.onclick = async () => {
    if (!srcImg) return;
    run.disabled = true; prog.style.display = 'block'; prog.value = 0;
    const scale = +$('scale').value, sharp = +$('sharp').value;
    const w0 = srcImg.naturalWidth, h0 = srcImg.naturalHeight;
    if (w0 * h0 * scale * scale > MAX_OUT) {
      setStatus('出力が大きすぎます。拡大率を下げるか、小さい画像を使ってください。');
      run.disabled = false; prog.style.display = 'none'; return;
    }
    const t0 = performance.now();
    let result, used = $('mode').value;
    try {
      if (used === 'ai') {
        setStatus('AIモデルを読み込んで処理中…（初回は少し時間がかかります）');
        result = await aiUpscale(srcImg, scale);
      }
    } catch (e) {
      console.warn(e); used = 'fast';
      setStatus('AI処理に失敗したため、高速方式に切り替えます…');
    }
    if (!result) {
      used = 'fast';
      result = resizeSmooth(srcImg, w0 * scale, h0 * scale);
      const c = document.createElement('canvas'); c.width = result.width; c.height = result.height;
      c.getContext('2d').drawImage(result, 0, 0); result = c;
    }
    await new Promise(r => setTimeout(r, 0));
    outCanvas = sharpen(result, used === 'ai' ? sharp * 0.5 : sharp);
    show(w0, h0, ((performance.now() - t0) / 1000).toFixed(1), used);
    run.disabled = false; prog.style.display = 'none';
  };

  function show(w0, h0, sec, used) {
    const a = $('after'), b = $('before');
    a.width = outCanvas.width; a.height = outCanvas.height;
    a.getContext('2d').drawImage(outCanvas, 0, 0);
    b.width = outCanvas.width; b.height = outCanvas.height;
    const g = b.getContext('2d'); g.imageSmoothingEnabled = false;
    g.drawImage(srcImg, 0, 0, outCanvas.width, outCanvas.height);
    $('result').style.display = 'block';
    $('meta').textContent = `${w0}×${h0} → ${outCanvas.width}×${outCanvas.height}px（${used === 'ai' ? 'AI' : '高速'}方式・${sec}秒）。`;
    setStatus('完了しました。');
    resetView(); makeBlob();
    $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---- 比較ビュー（スライダー + ピンチズーム + ドラッグ移動） ----
  const cmp = $('cmp'), stage = $('stage'), MAXZ = 16;
  let vs = 1, tx = 0, ty = 0, ratio = 0.5;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function applyView() {
    const W = cmp.clientWidth, H = cmp.clientHeight;
    vs = clamp(vs, 1, MAXZ);
    tx = clamp(tx, W - W * vs, 0); ty = clamp(ty, H - H * vs, 0);
    stage.style.transform = `translate(${tx}px, ${ty}px) scale(${vs})`;
    const local = clamp((ratio * W - tx) / (vs * W), 0, 1);
    document.querySelector('.before').style.clipPath = `inset(0 ${(1 - local) * 100}% 0 0)`;
    $('bar').style.left = ratio * 100 + '%';
  }
  function setSlider(r) { ratio = clamp(r, 0, 1); applyView(); }
  function zoomAt(f, px, py) {
    const ns = clamp(vs * f, 1, MAXZ);
    tx = px - (px - tx) / vs * ns; ty = py - (py - ty) / vs * ns; vs = ns; applyView();
  }
  function resetView() {
    vs = 1; tx = ty = 0; ratio = 0.5;
    cmp.style.maxWidth = Math.floor(innerHeight * 0.7 * outCanvas.width / outCanvas.height) + 'px';
    applyView();
  }

  const pts = new Map(); let mode = null, pinch = null;
  const rel = e => { const rc = cmp.getBoundingClientRect(); return { x: e.clientX - rc.left, y: e.clientY - rc.top, w: rc.width }; };
  function startPinch() {
    const [a, b] = [...pts.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, s: vs, tx, ty };
  }
  cmp.addEventListener('pointerdown', e => {
    cmp.setPointerCapture(e.pointerId);
    const p = rel(e); pts.set(e.pointerId, p);
    if (pts.size >= 2) { mode = 'pinch'; startPinch(); }
    else if (e.target.closest('#knob') || vs === 1) { mode = 'slider'; setSlider(p.x / p.w); }
    else mode = 'pan';
  });
  cmp.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId), p = rel(e); pts.set(e.pointerId, p);
    if (mode === 'slider') setSlider(p.x / p.w);
    else if (mode === 'pan') { tx += p.x - prev.x; ty += p.y - prev.y; applyView(); }
    else if (mode === 'pinch' && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const ns = clamp(pinch.s * d / pinch.d, 1, MAXZ);
      tx = mx - (pinch.mx - pinch.tx) / pinch.s * ns; ty = my - (pinch.my - pinch.ty) / pinch.s * ns;
      vs = ns; applyView();
    }
  });
  const endPtr = e => {
    pts.delete(e.pointerId);
    if (pts.size === 0) mode = null;
    else if (pts.size === 1) mode = 'pan';
  };
  cmp.addEventListener('pointerup', endPtr);
  cmp.addEventListener('pointercancel', endPtr);
  cmp.addEventListener('wheel', e => {
    e.preventDefault(); const p = rel(e);
    zoomAt(Math.exp(-e.deltaY * 0.002), p.x, p.y);
  }, { passive: false });
  cmp.addEventListener('dblclick', e => {
    const p = rel(e); if (vs > 1) { vs = 1; tx = ty = 0; applyView(); } else zoomAt(3, p.x, p.y);
  });
  const center = () => [cmp.clientWidth / 2, cmp.clientHeight / 2];
  $('zin').onclick = () => zoomAt(1.5, ...center());
  $('zout').onclick = () => zoomAt(1 / 1.5, ...center());
  $('zreset').onclick = () => { vs = 1; tx = ty = 0; applyView(); };
  window.addEventListener('resize', () => outCanvas && applyView());

  // ---- 保存 ----
  let outBlob = null;
  const outName = () => `${srcName}_x${$('scale').value}.png`;
  function makeBlob() {
    outBlob = null; $('save').disabled = true;
    outCanvas.toBlob(b => { outBlob = b; $('save').disabled = false; }, 'image/png');
  }
  function download() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(outBlob); a.download = outName(); a.click();
  }
  $('dl').onclick = () => outBlob && download();
  $('save').onclick = async () => {
    if (!outBlob) return;
    const file = new File([outBlob], outName(), { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); }
      catch (e) { if (e.name !== 'AbortError') download(); }
    } else download();
  };
})();
</script>
</body>
</html>
